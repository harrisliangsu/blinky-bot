name: Release

# A tag is the whole publish step. Merge to main first, then:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# mac-app, on macos-15 (Apple Silicon; macos-14 was retired), builds the Electron app, publishes the GitHub Release
# (DMG and zip), and signs the zip. The Sparkle feed is a release asset.
# The copy in the repository is updated through a pull request. This workflow
# does not push to main.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag, such as v0.2.0
        required: true

permissions:
  contents: read

# One release at a time. A second run waits so two uploads of the same tag
# do not replace each other's assets mid-publish.
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  mac-app:
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # package.json "version" is the app version. The tag has to agree with
      # it: the disk image name and CFBundleShortVersionString both come from
      # that field.
      - name: Tag and package.json must agree
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="${TAG#v}"
          FILE="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          echo "tag=$TAG  package.json=$FILE"
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::Tag v$TAG does not match package.json version ($FILE). Bump the version, commit, then re-tag."
            exit 1
          fi
          echo "VERSION=$FILE" >> "$GITHUB_ENV"

      - name: The changelog has an entry for this version
        run: |
          if ! python3 Scripts/changelog.py "$VERSION" >/dev/null; then
            echo "::error::CHANGELOG.md has no '## $VERSION' entry. Write it, commit, then re-tag."
            exit 1
          fi
          if ! python3 Scripts/changelog.py "$VERSION" --zh >/dev/null; then
            echo "::error::CHANGELOG.zh-CN.md has no '## $VERSION' entry. Write the Chinese notes, commit, then re-tag."
            exit 1
          fi

      - name: Free disk space
        run: |
          rm -rf ~/Library/Developer/CoreSimulator || true
          sudo rm -rf /Library/Developer/CoreSimulator || true
          df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm ci
          if ! node -e "require('electron')" >/dev/null 2>&1; then
            node node_modules/electron/install.js
          fi

      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          ./Scripts/package-mac.sh
          ls -lh "release/BlinkyBot-$VERSION.dmg" "release/BlinkyBot-$VERSION.zip"
          du -sh release/mac-arm64/BlinkyBot.app release/mac/BlinkyBot.app 2>/dev/null || true

      # Opens the .app the release is about to publish. A failed smoke stops
      # the tag before any asset is uploaded.
      - name: Packaged app smoke
        timeout-minutes: 15
        run: ./Scripts/open-smoke.sh

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinky-smoke
          path: release/smoke
          if-no-files-found: ignore

      - name: Release notes
        run: python3 Scripts/release-notes.py "$VERSION" > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$VERSION" in
            *-*) PRERELEASE="--prerelease" ;;
          esac

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release exists — replacing its assets and notes."
            gh release upload "v$VERSION" \
              "release/BlinkyBot-$VERSION.dmg" \
              "release/BlinkyBot-$VERSION.zip" \
              --clobber
            gh release edit "v$VERSION" --notes-file notes.md $PRERELEASE
          else
            gh release create "v$VERSION" \
              "release/BlinkyBot-$VERSION.dmg" \
              "release/BlinkyBot-$VERSION.zip" \
              --title "BlinkyBot $VERSION" \
              --notes-file notes.md \
              $PRERELEASE
          fi

      # After the zip exists on the release. The feed points at that asset.
      # SPARKLE_PRIVATE_KEY is the base64 Ed25519 seed whose public half is
      # Scripts/sparkle-public-key.txt. It is an Actions secret, not a file.
      # Do not rotate it. The workflow opens a pull request for the feed and
      # does not push to main.
      - name: Offer it to Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$VERSION" in
            *-*)
              echo "Pre-release $VERSION is not written into the feed."
              exit 0
              ;;
          esac
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY is not set. Add that Actions secret (the base64 Ed25519 seed for Scripts/sparkle-public-key.txt)."
            exit 1
          fi
          curl -fsSL -o /tmp/Sparkle-spm.zip "https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-for-Swift-Package-Manager.zip"
          echo "8d5fb41d960b43f4a68aa14126bf62b098544ec8d191cdcc73eb14e63a8e7606  /tmp/Sparkle-spm.zip" | shasum -a 256 -c -
          mkdir -p release
          unzip -p /tmp/Sparkle-spm.zip bin/sign_update > release/sign_update
          chmod +x release/sign_update
          URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION/BlinkyBot-$VERSION.zip"
          SPARKLE_SIGN_UPDATE="$PWD/release/sign_update" \
            python3 Scripts/appcast.py "$VERSION" "release/BlinkyBot-$VERSION.zip" "$URL"
          mkdir -p /tmp/blinky-feed
          cp appcast.xml appcast-zh.xml appcast-en.xml /tmp/blinky-feed/
          gh release upload "v$VERSION" appcast.xml appcast-zh.xml appcast-en.xml --clobber
          rm -f appcast.xml appcast-zh.xml appcast-en.xml
          git fetch origin main
          # Drop the feed edited in this checkout so the appcast branch
          # starts from main. This reset is local to the runner.
          git reset --hard
          git checkout -B "appcast-v$VERSION" origin/main
          cp /tmp/blinky-feed/appcast.xml /tmp/blinky-feed/appcast-zh.xml /tmp/blinky-feed/appcast-en.xml .
          git add appcast.xml appcast-zh.xml appcast-en.xml
          if git diff --cached --quiet -- appcast.xml appcast-zh.xml appcast-en.xml; then
            echo "Feed already offers $VERSION."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Offer $VERSION to Sparkle"
            git push --force origin "HEAD:appcast-v$VERSION"
            existing="$(gh pr list --head "appcast-v$VERSION" --state open --json number --jq '.[0].number // empty')"
            if [ -z "$existing" ]; then
              gh pr create --base main --head "appcast-v$VERSION" \
                --title "Offer $VERSION to Sparkle" \
                --body "Signed appcast from the v$VERSION release. Merge this pull request to update the feed files on main. The release workflow does not push to main."
            fi
            number="$(gh pr list --head "appcast-v$VERSION" --state open --json number --jq '.[0].number // empty')"
            if [ -z "$number" ]; then
              echo "::error::No pull request for appcast-v$VERSION."
              exit 1
            fi
            echo "Appcast pull request #$number is open. Merge it to publish the feed on main."
          fi
