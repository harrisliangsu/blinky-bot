name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend selection
        run: npm test
      - name: Release notes and Sparkle feed
        run: |
          python3 Scripts/release_test.py
          python3 Scripts/appcast_test.py
          bash -n Scripts/dmg.sh
          bash -n Scripts/zip-app.sh
          bash -n Scripts/package-mac.sh
          bash -n Scripts/open-smoke.sh
          bash -n Scripts/mac-app.sh
          bash -n Scripts/capture-shots.sh

  screenshots:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm ci
      - name: Build
        run: npm run build
      - name: Capture settings and chat
        run: bash Scripts/capture-shots.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-screenshots
          path: |
            shots/*.png
            shots/chat-no-backend.txt
            shots/failed
            shots/electron.log
          if-no-files-found: error
