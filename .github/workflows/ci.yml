name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend selection
        run: node --experimental-strip-types --test src/main/backends/defaultBackend.test.ts
      - name: Release notes and Sparkle feed
        run: |
          python3 Scripts/release_test.py
          python3 Scripts/appcast_test.py
          bash -n Scripts/dmg.sh
          bash -n Scripts/zip-app.sh
          bash -n Scripts/package-mac.sh
          bash -n Scripts/open-smoke.sh
          bash -n Scripts/mac-app.sh
